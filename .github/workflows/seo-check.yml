name: SEO build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/App.tsx'
      - 'src/pages/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/seo-check.yml'

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Unit test - Mind-Check routes and raw HTML checks
        run: |
          set +e
          npm run test:seo > seo-test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=test:seo failed::$(grep -v '^$' seo-test.log | grep -vE 'words; expand|fewer than two stored|structured subheadings|no article-specific' | grep -E 'blog-audit|rror|Missing|Invalid|duplicate|failed' | head -c 3000 | tr '\n' '~')"; fi
          exit $code
      - name: Full production build (prerender + sitemap + duplicate/canonical validation)
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=build failed::$(grep -v '^$' build.log | tail -c 2500 | tr '\n' '~')"; fi
          exit $code
      - name: Report raw HTML for sample pages
        run: |
          for p in mind-check/depression blog blog/what-is-therapy online-therapy-nigeria; do
            f="dist/$p/index.html"
            echo "== $p"; grep -o '<title>[^<]*</title>' "$f" | head -1; grep -o '<link rel="canonical"[^>]*>' "$f" | head -1
          done
          echo "sitemap URLs: $(grep -o '<loc>' dist/sitemap.xml dist/sitemap-blogs.xml | wc -l)"
